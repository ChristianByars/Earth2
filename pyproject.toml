[project]
name = "earth2"
version = "0.1.0"
description = "Earth2Studio tutorial: FCN, SFNO, hurricane tracking and Aurora 14-day forecasts"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Christian Byars" }]
dependencies = [
    "earth2studio[aurora,cyclone,data,fcn,sfno]==0.20.0",
    "torch==2.13.0",
    "cartopy>=0.22.0",
    "gcsfs>=2024.1.0",
    "imageio>=2.34.0",
    "makani",  # not on PyPI: resolved from [tool.uv.sources] (earth2studio[sfno] needs it; uv ignores a dependency's sources)
    "matplotlib>=3.8.1",
    "numpy>=1.26",
    "nvidia-ml-py",
    "pytest>=9.0.3",  # imported by cupy.testing, which earth2studio loads when cupy is present
    "tqdm>=4.60.0",
    "xarray>=2024.10.0",
    "zarr>=2.18.0",
]

[dependency-groups]
dev = ["ipykernel>=7.1.0", "nbconvert>=7.16.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
makani = { git = "https://github.com/NVIDIA/makani.git", rev = "b38fcb2799d7dbc146fa60459f3f9823394a8bf1" }  # same pin as earth2studio 0.20.0
flash-attn = { path = "wheels/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl" }
torch-harmonics = { path = "wheels/torch_harmonics-0.8.1-cp312-cp312-linux_x86_64.whl" }

[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = ["torch-harmonics==0.8.1", "flash-attn==2.8.3"]
no-build-isolation-package = ["torch-harmonics", "flash-attn"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch", "packaging", "ninja"]
torch-harmonics = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
priority = "supplemental"

